name: computer_science
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  share_plus: ^7.2.1
  rating_dialog: ^2.0.4
  lottie: ^3.1.0
  animated_splash_screen: ^1.3.0
  bulleted_list: ^0.0.1+0.1a
  url_launcher: ^6.3.0
  provider: ^6.1.2
  rebrand_cli: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "images/logo/logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "images/logo/logo.png"

flutter:
  uses-material-design: true

  assets:
    - images/
    - images/unit_1/
    - images/unit_2/
    - images/unit_4/
    - images/unit_5/
    - images/unit_6/
    - images/unit_3/
    - images/logo/

  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
